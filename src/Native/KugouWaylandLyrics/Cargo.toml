[package]
name = "kugou-wayland-lyrics"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"

[dependencies]
gtk = { package = "gtk4", version = "0.11" }
gtk4-layer-shell = "0.8"
pangocairo = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-segmentation = "1"

[profile.release]
lto = "thin"
strip = true
